<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Preview</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: linear-gradient(180deg, #bfe9ff 0%, #7fd0f5 100%);
      font-family: "Quicksand", system-ui, sans-serif;
    }

    .scene {
      position: relative;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .ground {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 90px;
      background: #7ac74f;
    }

    /* The hero stands beside the scene, outside #target, so a task's selector
       never targets him. */
    .hero {
      position: absolute;
      left: 24px;
      bottom: 70px;
      width: 90px;
      height: 135px;
    }

    /* A cube is a square: no border-radius, so the shape has a flat inside
       for the first command to paint. */
    #target {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 22px;
      background-color: #b9b4ac;
      box-shadow: inset -8px -10px 0 rgba(0, 0, 0, 0.12);
    }

    /* The child's CSS is injected here, after the base styles. */
    /* CHILD_CSS */
  </style>
</head>

<body>
  <div class="scene">
    <div class="ground"></div>
    <img class="hero" src="/assets/kid.svg" alt="">
    <div id="target"></div>
  </div>
</body>

</html>
