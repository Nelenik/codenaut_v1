<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Preview</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #bfe9ff 0%, #7fd0f5 100%);
      font-family: system-ui, sans-serif;
    }

    .scene {
      position: relative;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .ground {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 90px;
      background: #7ac74f;
    }

    .hero {
      position: absolute;
      left: 24px;
      bottom: 70px;
      width: 90px;
      height: 135px;
    }

    /* One badge, three jobs: paint the inside, paint the frame, paint the
       letters. Every one of them is a property from the earlier tasks. */
    #target {
      position: relative;
      z-index: 1;
      margin-bottom: 40px;
      padding: 18px 30px;
      border: 8px solid #2f2f3f;
      border-radius: 14px;
      background: #d9d9d9;
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #2f2f3f;
    }

    /* The child's CSS is injected here, after the base styles. */
    /* CHILD_CSS */
  </style>
</head>

<body>
  <div class="scene">
    <div class="ground"></div>
    <img class="hero" src="/assets/kid.svg" alt="">
    <div id="target">CODENAUT</div>
  </div>
</body>

</html>
