<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(180deg, #fffbe8 0%, #ffe9b8 100%);
    font-family: "Quicksand", system-ui, sans-serif;
  }

  .stage {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 0 24px;
  }

  /* The hero stands beside the scene, outside .card, so a task's selector
     never targets him. */
  .hero {
    width: 90px;
    height: 135px;
    flex: none;
    margin-bottom: 24px;
  }

  .card {
    width: 220px;
    padding: 24px;
    border-radius: 24px;
    background: #ffffff;
    text-align: center;
    box-shadow: 0 8px 0 #e8d59b;
  }

  .card img {
    width: 120px;
    height: 120px;
    display: block;
    margin: 0 auto 12px;
  }

  #target {
    display: block;
    font-size: 28px;
    font-weight: 700;
    color: #3a3226;
  }

  /* The child's CSS is injected here, after the base styles. */
  <!--CHILD_CSS-->
</style>
</head>
<body>
  <div class="stage">
    <div class="card">
      <img src="/assets/ball.svg" alt="">
      <span id="target">Round Ball</span>
    </div>
    <img class="hero" src="/assets/kid.svg" alt="">
  </div>
</body>
</html>
