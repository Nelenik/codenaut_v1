<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(180deg, #fffbe8 0%, #ffe9b8 100%);
    font-family: "Quicksand", system-ui, sans-serif;
  }

  .stage {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
  }

  .card {
    width: 220px;
    padding: 24px;
    border-radius: 24px;
    background: #ffffff;
    text-align: center;
    box-shadow: 0 8px 0 #e8d59b;
  }

  .card img {
    width: 120px;
    height: 120px;
    display: block;
    margin: 0 auto 12px;
  }

  #target {
    display: block;
    font-size: 28px;
    font-weight: 700;
    color: #3a3226;
  }

  .ground {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40px;
    background: #9ad06a;
  }

  /* The child's CSS is injected here, after the base styles. */
  <!--CHILD_CSS-->
</style>
</head>
<body>
  <div class="stage">
    <div class="card">
      <img src="/assets/ball.svg" alt="">
      <span id="target">Round Ball</span>
    </div>
  </div>
  <div class="ground"></div>
</body>
</html>
