<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Preview</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #0d1b4c 0%, #23407a 100%);
      font-family: system-ui, sans-serif;
    }

    .scene {
      position: relative;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .ground {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: #3c5a91;
    }

    .hero {
      position: absolute;
      left: 24px;
      bottom: 52px;
      width: 90px;
      height: 135px;
    }

    /* The rocket wrapper is not the target, so the nose and fins can follow the
       body when it grows. */
    .rocket {
      position: relative;
      flex: none;
      margin-bottom: 20px;
    }

    #target {
      position: relative;
      width: 80px;
      height: 70px;
      border-radius: 10px 10px 6px 6px;
      background: #f2f2f7;
      box-shadow: inset -10px 0 0 rgba(0, 0, 0, 0.08);
    }

    .nose {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 40px solid transparent;
      border-right: 40px solid transparent;
      border-bottom: 46px solid #ff6d00;
    }

    .window {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #00e5ff;
      box-shadow: inset 0 0 0 4px #0d3b52;
    }

    .fin {
      position: absolute;
      bottom: 0;
      width: 22px;
      height: 30px;
      background: #ff6d00;
    }

    .fin.left {
      left: -20px;
    }

    .fin.right {
      right: -20px;
    }

    /* The child's CSS is injected here, after the base styles. */
    /* CHILD_CSS */
  </style>
</head>

<body>
  <div class="scene">
    <div class="ground"></div>
    <img class="hero" src="/assets/kid.svg" alt="">
    <div class="rocket">
      <div class="nose"></div>
      <div id="target">
        <div class="window"></div>
      </div>
      <div class="fin left"></div>
      <div class="fin right"></div>
    </div>
  </div>
</body>

</html>
