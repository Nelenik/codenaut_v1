<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Preview</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #ffe6c9 0%, #ffbe7a 100%);
      font-family: system-ui, sans-serif;
    }

    .scene {
      position: relative;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .ground {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 90px;
      background: #d8a35f;
    }

    .hero {
      position: absolute;
      left: 24px;
      bottom: 70px;
      width: 90px;
      height: 135px;
    }

    .base {
      position: relative;
      margin-bottom: 26px;
      padding: 18px 22px 26px;
      border-radius: 8px 8px 0 0;
      background: #b9b3a8;
    }

    /* No padding and no border on #target: getComputedStyle would then report
       the content box, and the check compares the number the child asked for. */
    #target {
      position: relative;
      width: 90px;
      height: 130px;
      flex: none;
      border-radius: 6px;
      background: #7a4a22;
      box-shadow: inset 0 0 0 6px #5c3417;
    }

    .knob {
      position: absolute;
      top: 50%;
      right: 12px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffd600;
    }

    /* The child's CSS is injected here, after the base styles. */
    /* CHILD_CSS */
  </style>
</head>

<body>
  <div class="scene">
    <div class="ground"></div>
    <img class="hero" src="/assets/kid.svg" alt="">
    <div class="base">
      <div id="target">
        <div class="knob"></div>
      </div>
    </div>
  </div>
</body>

</html>
